<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From… to? – Missing Migrants 2014–2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
<style>
  :root { --ink:#dfe6ea; --muted:rgba(223,230,234,.55); --paper:#0b1522; --display: "Josefin Sans", system-ui, sans-serif; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); font-family: var(--display); font-weight:300; overflow:hidden; }
  body.sea  { --tint:#8fb4d4; --paper:#0b1522; }
  body.land { --ink:#efe3d2; --muted:rgba(239,227,210,.58); --tint:#d2a46e; --paper:#1a1009; }
  #stage { position:fixed; inset:0; }
  .display { font-family: var(--display); }
  #when { position:fixed; top:16px; left:20px; pointer-events:none; }
  #year { font-family: var(--display); font-size:clamp(44px, 8vw, 104px); line-height:.9; font-variant-numeric:tabular-nums; opacity:.9; }
  #month { font-size:13px; color:var(--muted); letter-spacing:.5px; margin-top:4px; }
  .panel { position:fixed; background:color-mix(in srgb, var(--paper) 70%, transparent); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:12px 14px; backdrop-filter: blur(3px); }
  #panel { top:14px; right:14px; width:min(300px, calc(100vw - 28px)); }
  h1 { font-family: var(--display); font-size:26px; font-weight:400; margin:0 0 4px; }
  .sub { font-size:11.5px; color:var(--muted); line-height:1.6; }
  #route { font-family: var(--display); font-size:20px; margin:10px 0 8px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .stats b { display:block; font-size:18px; color:var(--ink); font-weight:400; font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0; }
  .legend { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.8; }
  .legend i { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .legend span { margin-right:10px; }
  #controls { bottom:14px; left:14px; right:14px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .grp { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:0 2px 0 6px; }
  .ft-count { font-size:12px; color:var(--muted); } .ft-count b { font-size:20px; font-weight:400; color:var(--ink); margin-right:4px; }
  #fromto { position:fixed; bottom:74px; left:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  select { font:inherit; font-size:13px; color:var(--ink); background:var(--paper); border:1px solid rgba(255,255,255,.22); border-radius:10px; padding:5px 8px; max-width:260px; }
  button { font:inherit; font-size:12px; color:var(--ink); background:transparent; border:1px solid rgba(255,255,255,.22); border-radius:16px; padding:5px 11px; cursor:pointer; }
  button.on { background:var(--ink); color:var(--paper); }
  label { font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  input[type=range] { accent-color:var(--tint); width:100px; }
  #toggle { position:fixed; top:14px; right:330px; }
  @media (max-width:700px) { #toggle { right:auto; left:20px; top:auto; bottom:120px; } #panel { top:auto; bottom:110px; } }
</style>
</head>
<body class="sea">
<div id="stage"></div>

<div id="when"><div id="year">2014</div><div id="month">January</div></div>

<div class="panel" id="panel">
  <h1>From… to?</h1>
  <div class="sub">The lowest counts of those forced to leave their homes.<br>From death, through death, hoping to reach life.</div>
  <div id="route">—</div>
  <div class="stats">
    <div>Died<b id="c-dead">0</b></div>
    <div>Missing<b id="c-missing">0</b></div>
    <div>Children<b id="c-children">0</b></div>
    <div>Survived<b id="c-surv">0</b></div>
  </div>
  <div class="legend">Source: IOM Missing Migrants Project, 2014–2024.</div>
</div>

<button id="toggle">●</button>

<div class="panel" id="controls">
  <button id="play">⏸</button>
  <div class="presets" id="presets-sea"></div>
  <div class="presets" id="presets-land"></div>
  <button id="fromto-btn">From … To …</button>
  <label>Time <input id="speed" type="range" min="3" max="80" step="1" value="12"><span id="speedv"></span></label>
  <label>Wetness <input id="wet" type="range" min="0.4" max="2" step="0.05" value="1"></label>
</div>
<div class="panel" id="fromto" hidden>
  <label>From <select id="from"></select></label>
  <label>To <select id="to"></select></label>
  <span class="ft-count"><b id="ft-count"></b> dead and missing</span>
  <button id="go">Go</button>

</div>
<script src="sketch.js"></script>
</body>
</html>
